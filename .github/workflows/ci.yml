name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "codex/**"

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: content_automation_test
      PGUSER: postgres
      PGPASSWORD: postgres
      FB_GRAPH_VERSION: v25.0
      PUBLISH_ENABLED: "false"
      OPENAI_API_KEY: test-openai-key
      OPENAI_MODEL: gpt-5-mini
      GEMINI_API: test-gemini-key
      GEMINI_MODEL: gemini-2.5-flash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
